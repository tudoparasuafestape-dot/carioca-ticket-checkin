<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Carioca Ticket - Check-in</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --preto:#111111;
      --ouro:#e9aa17;
      --verde:#138a36;
      --vermelho:#b42318;
      --cinza:#f2f3f5;
      --texto:#1d1d1f;
      --muted:#6b6b70;
      --borda:#d9d9dd;
      --branco:#ffffff;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      background:var(--cinza);
      color:var(--texto);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    .wrap {
      width:min(100%,760px);
      margin:0 auto;
      padding:14px 14px 36px;
    }

    .voltar {
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin:0 0 12px;
      padding:9px 12px;
      border-radius:12px;
      background:#fff;
      color:#222;
      text-decoration:none;
      font-weight:800;
      font-size:14px;
      border:1px solid #e2e2e5;
    }

    .topo {
      background:var(--preto);
      color:#fff;
      border-radius:28px;
      padding:24px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom:16px;
    }

    .marca {
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .logo {
      width:92px;
      max-height:58px;
      object-fit:contain;
      flex:none;
    }

    .kicker {
      margin:0 0 6px;
      color:#f2c34e;
      font-size:12px;
      font-weight:900;
      letter-spacing:1.4px;
    }

    h1 {
      margin:0;
      font-size:clamp(28px,6vw,42px);
      line-height:1.05;
      font-weight:700;
    }

    .config {
      width:54px;
      height:54px;
      border-radius:16px;
      background:#333;
      display:grid;
      place-items:center;
      font-size:26px;
      flex:none;
    }

    .card {
      background:#fff;
      border-radius:26px;
      padding:18px;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
    }

    .linha-titulo {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:14px;
    }

    h2 {
      margin:0;
      font-size:24px;
      font-weight:700;
    }

    .status {
      padding:8px 12px;
      border-radius:999px;
      background:#dff5e5;
      color:#155f2d;
      font-size:13px;
      font-weight:800;
    }

    #reader {
      width:100%;
      min-height:340px;
      overflow:hidden;
      border-radius:24px;
      background:#080808;
    }

    #reader video {
      border-radius:24px;
    }

    .btn {
      width:100%;
      border:0;
      border-radius:18px;
      min-height:58px;
      padding:13px 18px;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      margin-top:14px;
    }

    .btn-verde { background:var(--verde); color:#fff; }
    .btn-vermelho { background:var(--vermelho); color:#fff; }
    .btn-preto { background:#171717; color:#fff; }

    .ajuda {
      margin:14px 4px 6px;
      color:var(--muted);
      text-align:center;
      font-size:15px;
    }

    .divisor {
      display:flex;
      align-items:center;
      gap:12px;
      margin:22px 0 14px;
      color:#747478;
      font-weight:800;
      font-size:13px;
    }

    .divisor:before,.divisor:after {
      content:"";
      height:1px;
      background:#d6d6da;
      flex:1;
    }

    input {
      width:100%;
      min-height:60px;
      border-radius:16px;
      border:1px solid #cfcfd4;
      padding:0 16px;
      font-size:18px;
      outline:none;
    }

    input:focus {
      border-color:#a97500;
      box-shadow:0 0 0 3px rgba(233,170,23,.16);
    }

    .resultado {
      display:none;
      margin-top:16px;
      padding:16px;
      border-radius:18px;
      font-size:15px;
      line-height:1.45;
    }

    .resultado.ok {
      display:block;
      background:#e7f7eb;
      color:#145d2a;
      border:1px solid #b9e4c4;
    }

    .resultado.aviso {
      display:block;
      background:#fff5d9;
      color:#744d00;
      border:1px solid #f0d796;
    }

    .resultado.erro {
      display:block;
      background:#fde9e7;
      color:#8a1c16;
      border:1px solid #f3bbb7;
    }

    .resultado strong {
      display:block;
      font-size:19px;
      margin-bottom:6px;
    }

    footer {
      text-align:center;
      color:#9a9aa0;
      font-size:12px;
      margin-top:20px;
    }

    @media (max-width:520px) {
      .topo {
        padding:20px 16px;
        border-radius:24px;
      }
      .logo { width:74px; }
      #reader { min-height:300px; }
    }
  </style>
</head>

      if (dados && dados.nome) detalhes.push('<b>Nome:</b> ' + escapar(dados.nome));
      if (dados && dados.tipoIngresso) detalhes.push('<b>Ingresso:</b> ' + escapar(dados.tipoIngresso));
      if (dados && dados.codigo) detalhes.push('<b>Código:</b> ' + escapar(dados.codigo));
      if (dados && dados.horario) detalhes.push('<b>Horário:</b> ' + escapar(dados.horario));

      resultado.className = 'resultado ' + classe;
      resultado.innerHTML =
        '<strong>' + escapar(titulo) + '</strong>' +
        '<div>' + escapar((dados && dados.mensagem) || 'Não foi possível validar.') + '</div>' +
        (detalhes.length ? '<div style="margin-top:8px">' + detalhes.join('<br>') + '</div>' : '');
    }

    function escapar(valor) {
      return String(valor == null ? '' : valor)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function validarCodigo(codigo) {
      codigo = normalizarCodigo(codigo);

      if (!codigo || processando) {
        if (!codigo) {
          mostrarResultado({
            tipo:'erro',
            mensagem:'Informe ou leia o código do ingresso.',
            codigo:''
          });
        }
        return;
      }

      processando = true;
      btnValidar.disabled = true;

      const callbackName =
        '__ctCheckin_' +
        Date.now() +
        '_' +
        Math.random().toString(36).slice(2);

      const script = document.createElement('script');

      const limpar = () => {
        processando = false;
        btnValidar.disabled = false;

        try { delete window[callbackName]; } catch(e) {}
        if (script.parentNode) script.parentNode.removeChild(script);
      };

      window[callbackName] = function(dados) {
        limpar();
        mostrarResultado(dados || {
          tipo:'erro',
          mensagem:'Resposta inválida do sistema.',
          codigo:codigo
        });

        if (dados && dados.sucesso === true) {
          codigoManual.value = '';
          if (navigator.vibrate) navigator.vibrate([80,60,80]);
        }
      };

      script.onerror = function() {
        limpar();
        mostrarResultado({
          tipo:'erro',
          mensagem:'Não foi possível conectar ao sistema de check-in.',
          codigo:codigo
        });
      };

      script.src =
        API_URL +
        '?action=checkin' +
        '&codigo=' + encodeURIComponent(codigo) +
        '&callback=' + encodeURIComponent(callbackName) +
        '&_=' + Date.now();

      document.body.appendChild(script);
    }

    async function iniciarCamera() {
      if (cameraAtiva) {
        await pararCamera();
        return;
      }

      resultado.className = 'resultado';
      resultado.innerHTML = '';

      if (typeof Html5Qrcode === 'undefined') {
        mostrarResultado({
          tipo:'erro',
          mensagem:'O leitor de QR Code não carregou. Verifique a conexão com a internet.'
        });
        return;
      }

      try {
        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode:'environment' },
          {
            fps:10,
            qrbox:function(viewfinderWidth, viewfinderHeight) {
              const lado = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.72);
              return { width:lado, height:lado };
            },
            aspectRatio:1.0
          },
          function(decodedText) {
            if (processando) return;

            const conteudoBruto = String(decodedText || '').trim();

            diagStatus.textContent = 'QR Code detectado pela câmera.';
            diagConteudo.textContent = 'Conteúdo lido: ' + conteudoBruto;

            const codigo = normalizarCodigo(conteudoBruto);

            codigoManual.value = codigo;

            setTimeout(function(){
              validarCodigo(codigo);
            }, 350);
          },
          function() {}
        );

        cameraAtiva = true;
        btnCamera.textContent = 'Parar câmera';
        btnCamera.classList.remove('btn-verde');
        btnCamera.classList.add('btn-vermelho');
        ajudaCamera.textContent = 'Câmera ativa. Aponte para o QR Code.';

      } catch (erro) {
        cameraAtiva = false;
        scanner = null;

        mostrarResultado({
          tipo:'erro',
          mensagem:
            'Não foi possível acessar a câmera. Verifique a permissão do navegador. ' +
            (erro && erro.message ? erro.message : String(erro || ''))
        });
      }
    }

    async function pararCamera() {
      try {
        if (scanner) {
          await scanner.stop();
          await scanner.clear();
        }
      } catch(e) {}

      scanner = null;
      cameraAtiva = false;
      btnCamera.textContent = 'Iniciar câmera';
      btnCamera.classList.remove('btn-vermelho');
      btnCamera.classList.add('btn-verde');
      ajudaCamera.textContent = 'Toque em “Iniciar câmera” e permita o acesso.';
    }

    btnCamera.addEventListener('click', iniciarCamera);

    btnValidar.addEventListener('click', function() {
      validarCodigo(codigoManual.value);
    });

    codigoManual.addEventListener('keydown', function(evento) {
      if (evento.key === 'Enter') {
        validarCodigo(codigoManual.value);
      }
    });

    window.addEventListener('pagehide', function() {
      if (cameraAtiva && scanner) {
        try { scanner.stop(); } catch(e) {}
      }
    });
  </script>
</body>
</html>
