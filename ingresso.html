<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Carioca Ticket - Ingresso Digital</title>
  <meta name="description" content="Acesse seu ingresso digital oficial Carioca Ticket.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Carioca Ticket">
  <meta property="og:title" content="Carioca Ticket - Ingresso Digital">
  <meta property="og:description" content="Seu ingresso digital oficial. Abra para visualizar seus dados e o QR Code de acesso.">
  <meta property="og:image" content="https://tudoparasuafestape-dot.github.io/carioca-ticket-checkin/carioca-ticket-icon-512.png">
  <meta property="og:image:secure_url" content="https://tudoparasuafestape-dot.github.io/carioca-ticket-checkin/carioca-ticket-icon-512.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Carioca Ticket">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Carioca Ticket - Ingresso Digital">
  <meta name="twitter:description" content="Seu ingresso digital oficial Carioca Ticket.">
  <meta name="twitter:image" content="https://tudoparasuafestape-dot.github.io/carioca-ticket-checkin/carioca-ticket-icon-512.png">

  <link rel="icon" href="https://tudoparasuafestape-dot.github.io/carioca-ticket-checkin/carioca-ticket-icon-192.png">
  <link rel="apple-touch-icon" href="https://tudoparasuafestape-dot.github.io/carioca-ticket-checkin/carioca-ticket-icon-192.png">

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#101010;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
    }
    .card{
      width:min(92vw,460px);
      padding:34px 24px;
      text-align:center;
    }
    img{
      width:150px;
      height:150px;
      object-fit:contain;
      display:block;
      margin:0 auto 18px;
      border-radius:28px;
    }
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0 0 22px;color:#c9c9c9;line-height:1.5}
    a{
      display:block;
      padding:16px 18px;
      border-radius:14px;
      background:#e7b334;
      color:#111;
      text-decoration:none;
      font-weight:800;
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      src="https://tudoparasuafestape-dot.github.io/carioca-ticket-checkin/carioca-ticket-icon-512.png"
      alt="Carioca Ticket"
    >
    <h1>Carioca Ticket</h1>
    <p>Redirecionando para seu ingresso digital oficial...</p>
    <a id="abrirIngresso" href="#">Abrir ingresso</a>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const destino = params.get('destino') || '';
      const botao = document.getElementById('abrirIngresso');

      function destinoPermitido(url) {
        try {
          const parsed = new URL(url);
          return (
            parsed.protocol === 'https:' &&
            parsed.hostname === 'script.google.com' &&
            parsed.pathname.indexOf('/macros/s/') === 0
          );
        } catch (e) {
          return false;
        }
      }

      if (!destinoPermitido(destino)) {
        document.querySelector('p').textContent =
          'O endereço deste ingresso está incompleto ou é inválido.';
        botao.style.display = 'none';
        return;
      }

      botao.href = destino;

      // Redirecionamento automático no navegador do cliente.
      window.setTimeout(function () {
        window.location.replace(destino);
      }, 180);
    })();
  </script>
</body>
</html>
